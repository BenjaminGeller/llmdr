[project]
name = "llmdr"
version = "0.0.1"
description = "LLM Detection and Response, tamper-evident audit trails for LLM traffic"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Benjamin Geller"}]
license = {text = "MIT"}
dependencies = [
    "cryptography~=47.0",
    "fastapi~=0.136.0",
    "httpx~=0.28.0",
    "typer~=0.25.0",
    "uvicorn~=0.49.0",
    "jinja2~=3.1",
    "detect-secrets~=1.5",
]

[project.optional-dependencies]
detection = [
    "presidio-analyzer~=2.2",
]
dev = [
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "black~=25.0",
    "ruff~=0.16",
]

[project.scripts]
llmdr = "llmdr.cli:app"

[project.urls]
Homepage = "https://github.com/BenjaminGeller/llmdr"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100

# Rule families are selected explicitly so lint results stay stable
# across ruff releases instead of tracking its shifting defaults:
# pycodestyle (E, W), pyflakes (F), isort (I).
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The embedded HTML template carries CSS and markup lines that read
# better unwrapped; E501 is a Python style rule, not an HTML one. The
# Python code around the template stays within 100 via Black.
"src/llmdr/report.py" = ["E501"]